[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cinetrack"
version = "1.0.0"
description = "CineTrack: MLOps-Based Movie Recommendation System"
authors = [{ name = "Samarth" }]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "joblib",
    "fastapi",
    "uvicorn",
    "pydantic",
    "streamlit",
    "mlflow",
    "dvc",
    "evidently",
    "requests",
    "plotly",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
